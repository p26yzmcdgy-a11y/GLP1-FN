<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8faf8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>GLP-1 Companion</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
<header class="topbar"><div><div class="eyebrow" id="greeting">Good evening</div><h1>Andrew <span>☀︎</span></h1></div><button class="icon-btn" id="lockBtn" aria-label="Lock app">⌕</button></header>
<main id="screen"></main>
<nav class="tabbar" aria-label="Main navigation">
<button data-tab="today" class="active"><span>⌂</span><small>Today</small></button>
<button data-tab="progress"><span>⌁</span><small>Progress</small></button>
<button data-tab="log"><span>＋</span><small>Log</small></button>
<button data-tab="more"><span>•••</span><small>More</small></button>
</nav>
<div class="sheet hidden" id="sheet"><div class="scrim"></div><section class="sheet-card"><div class="grab"></div><div id="sheetContent"></div></section></div>
<div class="toast hidden" id="toast"></div>
</div>
<script src="app.js"></script>
</body></html>
